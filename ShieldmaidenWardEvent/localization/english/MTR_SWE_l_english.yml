l_english:
 #ModInfo
 MTR_series_name:  "DeadMartyr's Tweaks"
 MTR_series_short_name: "MTR"
 MTR_series_desc:  "A collection of tweaks that are meant to be completely vanilla-friendly and overwrite no files."
 MTR_series_name_w_desc_tt: "#T $MTR_series_name$#!\n$MTR_series_desc$"
 MTR_SWE_mod_name: "Shieldmaiden Ward Event"
 MTR_SWE_mod_short_name: "SWE"
 MTR_SWE_mod_desc: "Mod that enables wards a chance to gain the shieldmaiden or shieldmaiden via an event on their 15th birthday.\nThis enables non-martial gender wards to get the Students of Knighthood traits upon reaching adulthood, if all other requirements are met.\nThe specific criteria is configurable via game-rule."
 MTR_SWE_mod_name_w_desc_tt: "#T $MTR_SWE_mod_name$#!\n$MTR_SWE_mod_desc$"

 #FakeDLC
 dlc_MTR_SWE:0      "Martyr's Tweaks: Shieldmaiden Ward Event"
 dlc_MTR_SWE_desc:0 "$MTR_SWE_mod_desc$"

 #GAMERULES
 game_rule_category_MTR: "#tooltip:MTR_series_name_w_desc_tt #color_goldy_yellow $MTR_series_short_name$#!#!"

 rule_MTR_SWE_eligibility_GR:0 "#tooltip:MTR_SWE_mod_name_w_desc_tt #color_goldy_yellow $MTR_SWE_mod_short_name$:#!#! Eligible Wards"
 setting_MTR_SWE_eligibility_GR_default:0      "Default"
 setting_MTR_SWE_eligibility_GR_default_desc:0 "The event will be available to all wards with martial education OR wards with a parent who is a shieldperson OR wards with enough traits that align with knighthood or relevant militant faiths."
 setting_MTR_SWE_eligibility_GR_relaxed:0      "Relaxed"
 setting_MTR_SWE_eligibility_GR_relaxed_desc:0 "The event will be available to ALL wards who are of cultures with shieldpersons."
 setting_MTR_SWE_eligibility_GR_deactivated:0      "Deactivated"
 setting_MTR_SWE_eligibility_GR_deactivated_desc:0 "The event will be disabled in all cases."

 rule_MTR_SWE_odds_GR:0 "#tooltip:MTR_SWE_mod_name_w_desc_tt #color_goldy_yellow $MTR_SWE_mod_short_name$:#!#! Successful Duel Odds"
 setting_MTR_SWE_odds_GR_normal:0      "Normal Odds"
 setting_MTR_SWE_odds_GR_normal_desc:0 "The chances for successful attempts are unchanged. Not every ward is expected to succeed, especially without aligned traits, high prowess, or a capable guardian."
 setting_MTR_SWE_odds_GR_increased:0      "Increased Odds"
 setting_MTR_SWE_odds_GR_increased_desc:0 "The chances for successful attempts are increased. Most wards will have a good chance to succeed."

 #EFFECTS
 MTR_SWE_child_squiring_success_effect.desc:0 "[child.GetFirstNameNoTooltip|U] has earned their place in the shield-wall!"
 MTR_SWE_child_squiring_failure_effect.desc:0 "[child.GetFirstNameNoTooltip|U] just isn't meant for combat..."
 MTR_SWE_self_squiring_success_effect.desc:0  "I will earn my place in the shield-wall!"
 MTR_SWE_self_squiring_failure_effect.desc:0  "Maybe I'm just not meant for combat..."

 #EVENTS

 #Guardian POV
 MTR_SWE.1001.message_good:0 "[child.GetFirstName|U] joins the shield-wall!"
 MTR_SWE.1001.message_bad:0  "[child.GetFirstName|U] just isn't meant for combat..."

 MTR_SWE.1002.t:0    "Makings of a Warrior"
 MTR_SWE.1002.desc:0 "Description of the event from the Guardian's POV"
 MTR_SWE.1002.start.culture_both:0 "Your ward [child.GetFirstName|U] is nearing their coming-of-age and shows enough promise that you believe that they may be able to participate in combat.  Many notable warriors started as exceptions and have served their realms well, perhaps this child may join those exceptions...\n\n"
 MTR_SWE.1002.start.culture_child_only:0 "Your ward [child.GetFirstName|U] is nearing their coming-of-age and - while the idea seems a bit foreign to you - the child does stem from a culture where gender does not necessarily prohibit participating in battle. Exceptions could be made and perhaps it's an idea worth entertaining...\n\n"

 MTR_SWE.1002.desc.trait_intro:0          "Throughout your experiences with [child.GetFirstNameNoTooltip|U], it has become clear that [child.GetSheHe] has a temperament that may be worthy of battle; [child.GetHerHis|U]"
 MTR_SWE.1002.desc.trait_ambitious:0      "ambition,"
 MTR_SWE.1002.desc.trait_arrogant:0       "audaciousness,"
 MTR_SWE.1002.desc.trait_brave:0          "courage,"
 MTR_SWE.1002.desc.trait_eccentric:0      "eccentricity,"
 MTR_SWE.1002.desc.trait_sadistic:0       "mercilessness,"
 MTR_SWE.1002.desc.trait_strong:0         "strength,"
 MTR_SWE.1002.desc.trait_vengeful:0       "vindictiveness,"
 MTR_SWE.1002.desc.trait_wrathful:0       "wrath,"
 MTR_SWE.1002.desc.trait_zealous:0        "zealotry,"
 MTR_SWE.1002.desc.trait_ending_female:0  "and character all indicate the makings of a shieldmaiden.\n\n"
 MTR_SWE.1002.desc.trait_ending_male:0    "and character all indicate the makings of a shieldswain.\n\n"
 
 MTR_SWE.1002.desc.education_martial:0    "Through martial study and cultural customs, [child.GetFirstName] is granted the right to prove themselves to be capable enough to participate in combat.\n\n"
 
 MTR_SWE.1002.desc.parents_legacy_intro_scared:0 "Despite their bouts of cowardice, young"
 MTR_SWE.1002.desc.parents_legacy_intro_normal:0 "Young"
 MTR_SWE.1002.desc.parents_legacy_ending:0       "[child.GetFirstNameNoTooltip|U] has a legacy to uphold which calls [child.GetHerHim] to participate in the shield-wall.\n\n"

 MTR_SWE.1002.a:0    "Allow them to assist and squire in battle."
 MTR_SWE.1002.b:0    "Things are the way that they are for a reason."

 #Ward POV
 MTR_SWE.1003.t:0    "Makings of a Warrior"
 MTR_SWE.1003.desc:0 "Description of the event from the Ward's POV"

 MTR_SWE.1003.start:0  "Often I find myself dreaming of standing on the battlefield. When I finish my studies early, I find a secluded spot and practice swinging a blade. I have been practicing for hours and been lost in thought - but that is broken as I sense someone behind me.\n\nI turn to see my guardian [guardian.GetFirstName|U] standing before me.  Before I can explain, [guardian.GetSheHe|L] speaks:\n\n"
 MTR_SWE.1003.start.culture_both:0 ""You show enough promise that I believe that you may be able to participate in battle," [guardian.GetSheHe|L] says, "Many notable warriors actually started as exceptions and have served their realms well; I will vouch for your capabilities if you wish to become one of those exceptions..."\n\n"
 MTR_SWE.1003.start.culture_child_only:0 ""While the idea is foreign to me I understand that you may wish to participate in battle," [guardian.GetSheHe|L] says, "You may be a [GetWomanMan|L]... but I have seen enough that I will vouch for your capabilities."\n\n"

 MTR_SWE.1003.desc.trait_intro:0          "Throughout my upbringing I have shown that I am capable and have the temperament for battle. My"
 MTR_SWE.1003.desc.trait_ending_female:0  "and character all indicate that I have the makings of a shieldmaiden.\n\n"
 MTR_SWE.1003.desc.trait_ending_male:0    "and character all indicate that I have the makings of a shieldswain.\n\n"
 
 MTR_SWE.1003.desc.education_martial:0    "According to the customs of my people, martial study awards the right to prove my worth in combat should I desire to do so.\n\n"
 
 MTR_SWE.1003.desc.parents_legacy_intro_scared:0 "My hands tremble as I sigh. Despite my fear,"
 MTR_SWE.1003.desc.parents_legacy_intro_normal:0 "The air is still."
 MTR_SWE.1003.desc.parents_legacy_ending:0       "I know that I would not be the first in my family to participate in the shield-wall - I have a legacy behind me.\n\n"

 MTR_SWE.1003.a:0    "Let me stand in the shield-wall!"
 MTR_SWE.1003.b:0    "Perhaps things are the way that they are for a reason..."
